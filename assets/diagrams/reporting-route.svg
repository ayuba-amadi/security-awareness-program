<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">No-blame reporting route</title><desc id="desc">Staff stop, report through the approved route, receive acknowledgement, and benefit from lessons learned.</desc>
<rect width="1200" height="420" fill="#f7fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12314a">No-Blame Reporting Route</text>
<g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#fff1d6" stroke="#cb7a00" stroke-width="3"><rect x="50" y="140" width="210" height="120" rx="16"/></g><g fill="#eff5fa" stroke="#4a7a9a" stroke-width="3"><rect x="350" y="140" width="210" height="120" rx="16"/><rect x="650" y="140" width="210" height="120" rx="16"/></g><g fill="#e5f5f2" stroke="#007c78" stroke-width="3"><rect x="950" y="140" width="200" height="120" rx="16"/></g><g fill="#12314a"><g font-size="22" font-weight="700"><text x="155" y="185">1  STOP</text><text x="455" y="185">2  REPORT</text><text x="755" y="185">3  RESPOND</text><text x="1050" y="185">4  LEARN</text></g><g font-size="17"><text x="155" y="215">Do not forward</text><text x="155" y="238">or act under pressure</text><text x="455" y="215">Use approved mailbox</text><text x="455" y="238">or service desk</text><text x="755" y="215">Acknowledge, classify</text><text x="755" y="238">and provide help</text><text x="1050" y="215">Share anonymised</text><text x="1050" y="238">lessons and improve</text></g></g></g><g stroke="#36576d" stroke-width="4" fill="none"><path d="M260 200h80"/><path d="M560 200h80"/><path d="M860 200h80"/></g><g fill="#36576d"><path d="M340 200l-12-8v16z"/><path d="M640 200l-12-8v16z"/><path d="M940 200l-12-8v16z"/></g><text x="600" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#36576d">Report promptly. Honest reporting supports remediation and safer work.</text></svg>
