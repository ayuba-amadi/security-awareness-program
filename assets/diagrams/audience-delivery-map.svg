<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Audience-specific awareness delivery design</title><desc id="desc">Four workforce audiences receive different security awareness activities designed for their work.</desc>
<rect width="1200" height="560" fill="#f7fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12314a">Role-Based Delivery for Northbridge Staff</text>
<g font-family="Arial, sans-serif"><g fill="#e5f5f2" stroke="#007c78" stroke-width="3"><rect x="55" y="120" width="245" height="140" rx="16"/><rect x="335" y="120" width="245" height="140" rx="16"/><rect x="615" y="120" width="245" height="140" rx="16"/><rect x="895" y="120" width="245" height="140" rx="16"/></g><g text-anchor="middle" fill="#12314a"><g font-size="21" font-weight="700"><text x="177" y="160">FINANCE AND</text><text x="177" y="185">PROCUREMENT</text><text x="457" y="160">WAREHOUSE AND</text><text x="457" y="185">SHIFT STAFF</text><text x="737" y="160">REMOTE SALES AND</text><text x="737" y="185">CUSTOMER TEAMS</text><text x="1017" y="160">MANAGERS AND</text><text x="1017" y="185">PRIVILEGED USERS</text></g><g font-size="17"><text x="177" y="220">Fraud case exercise</text><text x="457" y="220">Five-minute briefing</text><text x="737" y="220">Mobile microlearning</text><text x="1017" y="220">Tabletop briefing</text></g></g><g fill="#eff5fa" stroke="#4a7a9a" stroke-width="3"><rect x="55" y="340" width="245" height="110" rx="16"/><rect x="335" y="340" width="245" height="110" rx="16"/><rect x="615" y="340" width="245" height="110" rx="16"/><rect x="895" y="340" width="245" height="110" rx="16"/></g><g text-anchor="middle" fill="#12314a" font-size="17"><text x="177" y="385">Verify payment changes</text><text x="177" y="412">and report fraud</text><text x="457" y="385">Recognise scams and</text><text x="457" y="412">secure shared devices</text><text x="737" y="385">Protect credentials and</text><text x="737" y="412">handle customer data</text><text x="1017" y="385">Approve controls and</text><text x="1017" y="412">remove barriers</text></g></g><g stroke="#36576d" stroke-width="3"><path d="M177 260v70"/><path d="M457 260v70"/><path d="M737 260v70"/><path d="M1017 260v70"/></g></svg>
