<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Risk to safer behaviour map</title><desc id="desc">Three human-driven risks are connected to unsafe actions and safer behaviours.</desc>
